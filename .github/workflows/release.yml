name: release

# Manual only. Nothing in this file triggers on push, merge or tag — you
# dispatch it from the Actions tab (and pick the branch there).
#
#   1. version  — derive the next semver from the conventional commits since
#                 the last v* tag, or take the explicit override input.
#   2. build    — build every platform with that version patched into the
#                 manifests. The patch happens in the runner workspace only;
#                 nothing is ever committed or pushed back to the repo.
#   3. release  — a DRAFT GitHub release tagged v<version>, changelog as the
#                 body, artifacts attached. The git tag is created by GitHub
#                 when you publish the draft, so dispatching this is always
#                 reversible: delete the draft and nothing remains.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump — 'auto' derives it from conventional commits"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: 'Explicit version, e.g. 1.4.0 (overrides "bump")'
        type: string
        required: false
      platform:
        description: 'Platform to build'
        type: choice
        default: all
        options:
          - all
          - macos-aarch64
          - macos-x86_64
          - ubuntu
          - ubuntu-arm
          - windows
      prerelease:
        description: 'Mark the release as a prerelease'
        type: boolean
        default: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      previous_tag: ${{ steps.semver.outputs.previous_tag }}
      changelog: ${{ steps.semver.outputs.changelog }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and changelog
        id: semver
        shell: bash
        env:
          BUMP_INPUT: ${{ inputs.bump }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          D="$RUNNER_TEMP/changelog"
          mkdir -p "$D"

          # Baseline = the most recently created release tag, accepting every
          # scheme this repo has used (1.2.3, v1.2.3, app-v1.2.3) so a rename
          # never makes the next version go backwards. Sorting by date rather
          # than by version matters for repos that switched schemes: an
          # abandoned CalVer tag must not outrank the current 4.x line.
          # Prerelease/test tags are excluded by the anchored pattern.
          # New tags are always emitted as plain v<semver>.
          PREV=$(git tag --list --sort=-creatordate \
            | grep -E '^([A-Za-z][A-Za-z0-9_.-]*-)?v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n1 || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            BASE=$(printf '%s' "$PREV" | sed -E 's/^([A-Za-z][A-Za-z0-9_.-]*-)?v?//')
          else
            RANGE=""
            BASE="0.0.0"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<<"$BASE"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

          # \x1f separates fields, \x1e terminates each record, so subjects and
          # bodies containing newlines survive the round trip intact.
          if [ -n "$RANGE" ]; then
            git log --no-merges --format='%h%x1f%s%x1f%b%x1e' "$RANGE" > "$D/commits"
          else
            git log --no-merges --format='%h%x1f%s%x1f%b%x1e' > "$D/commits"
          fi

          HAS_FEAT=0; HAS_BREAKING=0; COUNT=0
          while IFS=$'\x1f' read -r -d $'\x1e' SHA SUBJECT BODY; do
            SHA="${SHA#$'\n'}"
            [ -z "$SHA" ] && continue
            COUNT=$((COUNT + 1))

            if [[ "$SUBJECT" =~ ^([a-zA-Z]+)(\(([^\)]*)\))?(!)?:[[:space:]]*(.*)$ ]]; then
              TYPE=$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              SCOPE="${BASH_REMATCH[3]}"
              BANG="${BASH_REMATCH[4]}"
              DESC="${BASH_REMATCH[5]}"
            else
              TYPE="other"; SCOPE=""; BANG=""; DESC="$SUBJECT"
            fi

            IS_BREAKING=0
            [ -n "$BANG" ] && IS_BREAKING=1
            if printf '%s' "$BODY" | grep -qE '^BREAKING[ -]CHANGE'; then
              IS_BREAKING=1
            fi

            if [ -n "$SCOPE" ]; then
              ENTRY="- **${SCOPE}:** ${DESC} (${SHA})"
            else
              ENTRY="- ${DESC} (${SHA})"
            fi

            case "$TYPE" in
              feat|feature) HAS_FEAT=1; echo "$ENTRY" >> "$D/feat" ;;
              fix|bugfix)   echo "$ENTRY" >> "$D/fix" ;;
              perf)         echo "$ENTRY" >> "$D/perf" ;;
              refactor)     echo "$ENTRY" >> "$D/refactor" ;;
              docs)         echo "$ENTRY" >> "$D/docs" ;;
              *)            echo "$ENTRY" >> "$D/misc" ;;
            esac
            [ "$IS_BREAKING" = 1 ] && echo "$ENTRY" >> "$D/breaking"
          done < "$D/commits"

          if [ -n "$VERSION_INPUT" ]; then
            VERSION="${VERSION_INPUT#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
              echo "::error::'$VERSION_INPUT' is not a valid semver version (expected e.g. 1.4.0)"
              exit 1
            fi
          else
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::No commits since ${PREV:-the start of history} — nothing to release."
              exit 1
            fi
            BUMP="$BUMP_INPUT"
            if [ "$BUMP" = "auto" ]; then
              if   [ "$HAS_BREAKING" = 1 ]; then BUMP="major"
              elif [ "$HAS_FEAT" = 1 ];     then BUMP="minor"
              else                               BUMP="patch"
              fi
            fi
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Pass an explicit 'version' input to pick another."
            exit 1
          fi

          {
            if [ -s "$D/breaking" ]; then echo "### ⚠ BREAKING CHANGES"; echo; cat "$D/breaking"; echo; fi
            if [ -s "$D/feat" ];     then echo "### Features";           echo; cat "$D/feat";     echo; fi
            if [ -s "$D/fix" ];      then echo "### Bug Fixes";          echo; cat "$D/fix";      echo; fi
            if [ -s "$D/perf" ];     then echo "### Performance";        echo; cat "$D/perf";     echo; fi
            if [ -s "$D/refactor" ]; then echo "### Refactoring";        echo; cat "$D/refactor"; echo; fi
            if [ -s "$D/docs" ];     then echo "### Documentation";      echo; cat "$D/docs";     echo; fi
            if [ -s "$D/misc" ];     then echo "### Other";              echo; cat "$D/misc";     echo; fi
            if [ -n "$PREV" ]; then
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > "$D/changelog.md"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "previous_tag=${PREV}"
            echo "changelog<<__CHANGELOG_EOF__"
            cat "$D/changelog.md"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## ${TAG}"
            echo
            echo "Previous tag: \`${PREV:-none}\` · commits analysed: ${COUNT}"
            echo
            cat "$D/changelog.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build platform matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          ALL='[
            {"id":"macos-aarch64","runs_on":"macos-latest","target":"aarch64-apple-darwin","os":"macos"},
            {"id":"macos-x86_64","runs_on":"macos-latest","target":"x86_64-apple-darwin","os":"macos"},
            {"id":"ubuntu","runs_on":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","os":"linux"},
            {"id":"ubuntu-arm","runs_on":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","os":"linux"},
            {"id":"windows","runs_on":"windows-2022","target":"x86_64-pc-windows-msvc","os":"windows"}
          ]'
          PLATFORM="${{ inputs.platform }}"
          if [ -z "$PLATFORM" ] || [ "$PLATFORM" = "all" ]; then
            INCLUDE="$ALL"
          else
            INCLUDE=$(echo "$ALL" | jq "[.[] | select(.id == \"$PLATFORM\")]")
          fi
          echo "matrix=$(echo "$INCLUDE" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.id }}
    needs: version
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config file libfuse2 xdg-utils \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libfontconfig-dev libasound2-dev libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './Launcher -> target'
          key: ${{ matrix.id }}

      - name: Install packaging tools
        run: |
          cargo install cargo-packager --locked
          if [ "${{ matrix.os }}" = "linux" ]; then cargo install cargo-generate-rpm --locked; fi

      - name: setup node (updater signing)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # The edit lives only in the runner workspace — never committed back.
      - name: Apply release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          perl -0pi -e 's/^(\[package\](?:[^\[]*?)\nversion\s*=\s*")[^"]*(")/${1}'"$VERSION"'${2}/ms' Launcher/Cargo.toml
          grep -m1 '^version' Launcher/Cargo.toml

      - name: Build
        working-directory: Launcher
        run: cargo build --release --target ${{ matrix.target }}

      # ---- Windows: nytuo-launcher_<v>_x64-setup.exe (NSIS)
      - name: Package (Windows)
        if: matrix.os == 'windows'
        working-directory: Launcher
        run: cargo packager --release --target ${{ matrix.target }} --formats nsis

      # ---- macOS: nytuo-launcher_<v>_{aarch64,x64}.dmg + updater .app.tar.gz
      - name: Package (macOS)
        if: matrix.os == 'macos'
        working-directory: Launcher
        run: |
          set -euo pipefail
          cargo packager --release --target ${{ matrix.target }} --formats app,dmg
          ARCH="${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}"
          tar -C dist -czf "dist/nytuo-launcher_${ARCH}.app.tar.gz" nytuo-launcher.app
          rm -rf dist/nytuo-launcher.app

      # ---- Linux: .deb + .AppImage (amd64 / arm64) and .rpm
      - name: Package (Linux)
        if: matrix.os == 'linux'
        working-directory: Launcher
        run: |
          set -euo pipefail
          cargo packager --release --target ${{ matrix.target }} --formats deb,appimage
          cargo generate-rpm --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/generate-rpm/*.rpm dist/

      # ---- Updater signatures (same minisign key the Tauri updater used)
      - name: Sign updater artifacts
        working-directory: Launcher/dist
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set — updater signatures skipped"
            exit 0
          fi
          for f in *-setup.exe *.app.tar.gz *.AppImage; do
            [ -e "$f" ] || continue
            npx --yes @tauri-apps/cli@2 signer sign "$f"
          done
          ls -la

      - name: List artifacts
        run: ls -la Launcher/dist

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.id }}
          path: |
            Launcher/dist/*.exe
            Launcher/dist/*.dmg
            Launcher/dist/*.app.tar.gz
            Launcher/dist/*.deb
            Launcher/dist/*.rpm
            Launcher/dist/*.AppImage
            Launcher/dist/*.sig
          if-no-files-found: error

  release:
    name: Draft release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: launcher-*

      # latest.json for the in-app updater (the format Tauri 4.x clients already poll at
      # releases/latest/download/latest.json, so existing installs keep updating).
      - name: Generate latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          NOTES: ${{ needs.version.outputs.changelog }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          entry() { # <platform-key> <artifact dir> <glob>
            local dir="dist/launcher-$2"
            [ -d "$dir" ] || return 0
            local file; file=$(cd "$dir" && ls $3 2>/dev/null | head -n1 || true)
            [ -n "$file" ] && [ -f "$dir/$file.sig" ] || return 0
            jq -n --arg k "$1" --arg u "$BASE/$file" --rawfile s "$dir/$file.sig" \
              '{($k): {signature: ($s | rtrimstr("\n")), url: $u}}'
          }
          {
            entry windows-x86_64 windows '*-setup.exe'
            entry darwin-aarch64 macos-aarch64 '*.app.tar.gz'
            entry darwin-x86_64 macos-x86_64 '*.app.tar.gz'
            entry linux-x86_64 ubuntu '*.AppImage'
            entry linux-aarch64 ubuntu-arm '*.AppImage'
          } | jq -s --arg v "$VERSION" --arg n "$NOTES" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version: $v, notes: $n, pub_date: $d, platforms: (add // {})}' > latest.json
          cat latest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 'Nytuo Launcher ${{ needs.version.outputs.tag }}'
          body: ${{ needs.version.outputs.changelog }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/*/*
            latest.json
